<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Dev-Detective | GitHub Profile Search</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet"/>
<style>
  *{box-sizing:border-box;margin:0;padding:0}

  /* Light mode — grey + GitHub blue */
  :root{
    --accent:#2f81f7;
    --accent2:#388bfd;
    --accent-light:rgba(47,129,247,0.08);
    --mono:'Space Mono',monospace;
    --bg:#e8eaed;
    --bg2:#d1d5db;
    --border:#b0b7c3;
    --text:#1f2328;
    --text2:#4b5563;
    --text3:#9ca3af;
    --shadow:0 4px 24px rgba(47,129,247,0.08);
  }

  /* Dark mode — GitHub dark */
  [data-theme="dark"]{
    --accent:#2f81f7;
    --accent2:#388bfd;
    --accent-light:rgba(47,129,247,0.1);
    --bg:#161b22;
    --bg2:#0d1117;
    --border:#30363d;
    --text:#e6edf3;
    --text2:#8b949e;
    --text3:#484f58;
    --shadow:0 4px 24px rgba(0,0,0,0.5);
  }

  body{font-family:'Syne',sans-serif;background:var(--bg2);min-height:100vh;color:var(--text);transition:background 0.3s,color 0.3s}

  .app{max-width:860px;margin:0 auto;padding:2rem 1rem 4rem}

  /* Header */
  .header{display:flex;align-items:center;gap:16px;margin-bottom:2rem;padding-bottom:1.5rem;border-bottom:1px solid var(--border)}
  .logo{width:44px;height:44px;border-radius:10px;background:var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:transform 0.2s,box-shadow 0.2s}
  .logo:hover{transform:scale(1.08);box-shadow:0 0 0 4px rgba(37,99,235,0.2)}
  .logo i{font-size:22px;color:#fff}
  .brand h1{font-size:20px;font-weight:800;color:var(--text);letter-spacing:-0.5px}
  .brand p{font-size:12px;color:var(--text2);font-family:var(--mono);margin-top:2px}

  /* Dark mode toggle */
  .dark-toggle{margin-left:auto;width:36px;height:36px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text2);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;transition:all 0.2s;flex-shrink:0}
  .dark-toggle:hover{background:var(--accent-light);color:var(--accent);border-color:var(--accent);transform:rotate(20deg)}

  /* Mode toggle */
  .mode-bar{display:flex;gap:8px;margin-bottom:1.5rem;align-items:center;flex-wrap:wrap}
  .mode-btn{padding:7px 16px;border:1px solid var(--border);border-radius:8px;font-family:'Syne',sans-serif;font-size:13px;font-weight:600;cursor:pointer;background:var(--bg);color:var(--text2);transition:all 0.2s}
  .mode-btn:hover{background:var(--accent-light);color:var(--accent);border-color:var(--accent)}
  .mode-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
  .mode-badge{font-size:10px;font-family:var(--mono);padding:2px 7px;border-radius:4px;background:var(--bg);color:var(--text3);border:1px solid var(--border);margin-left:auto}

  /* Search area */
  .search-section{background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:1.25rem;margin-bottom:1.5rem;box-shadow:var(--shadow);transition:background 0.3s,border-color 0.3s}
  .input-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .gh-input{flex:1;min-width:140px;font-family:var(--mono);font-size:13px;padding:10px 14px;border:1px solid var(--border);border-radius:8px;background:var(--bg2);color:var(--text);outline:none;transition:all 0.2s}
  .gh-input:hover{border-color:var(--accent);background:var(--accent-light)}
  .gh-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(47,129,247,0.15)}
  .gh-input::placeholder{color:var(--text3)}
  .vs-label{font-size:11px;font-family:var(--mono);color:var(--text2);font-weight:700;padding:0 4px;flex-shrink:0}
  .search-btn{padding:10px 20px;background:var(--accent);color:#fff;border:none;border-radius:8px;font-family:'Syne',sans-serif;font-size:13px;font-weight:700;cursor:pointer;transition:all 0.2s;white-space:nowrap}
  .search-btn:hover{background:var(--accent2);transform:translateY(-1px);box-shadow:0 4px 12px rgba(47,129,247,0.4)}
  .search-btn:active{transform:translateY(0)}
  .search-btn:disabled{opacity:0.5;cursor:not-allowed;transform:none;box-shadow:none}

  /* Output area */
  .output{display:grid;gap:1rem}
  .battle-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
  @media(max-width:600px){.battle-grid{grid-template-columns:1fr}}

  /* Profile card */
  .profile-card{background:var(--bg);border:1px solid var(--border);border-radius:12px;overflow:hidden;box-shadow:var(--shadow);transition:transform 0.2s,box-shadow 0.2s,border-color 0.2s}
  .profile-card:hover{transform:translateY(-3px);box-shadow:0 8px 32px rgba(47,129,247,0.12);border-color:var(--accent)}
  .profile-card.winner{border:2px solid #2f81f7}
  .profile-card.winner:hover{box-shadow:0 8px 32px rgba(47,129,247,0.2)}
  .profile-card.loser{border:2px solid #f85149}
  .profile-card.loser:hover{box-shadow:0 8px 32px rgba(248,81,73,0.15)}

  .card-header{padding:1.25rem;display:flex;gap:14px;align-items:flex-start}
  .avatar{width:64px;height:64px;border-radius:50%;border:2px solid var(--border);flex-shrink:0;object-fit:cover;transition:transform 0.2s,border-color 0.2s}
  .avatar:hover{transform:scale(1.08);border-color:var(--accent)}
  .user-info{flex:1;min-width:0}
  .user-name{font-size:16px;font-weight:800;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .user-login{font-size:12px;font-family:var(--mono);color:var(--accent);margin-top:2px}
  .user-bio{font-size:12px;color:var(--text2);margin-top:6px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

  .card-stats{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--border)}
  .stat{padding:12px 8px;text-align:center;border-right:1px solid var(--border);transition:background 0.2s;cursor:default}
  .stat:hover{background:var(--accent-light)}
  .stat:last-child{border-right:none}
  .stat-val{font-size:15px;font-weight:700;color:var(--accent);font-family:var(--mono)}
  .stat-lbl{font-size:10px;color:var(--text2);margin-top:3px;text-transform:uppercase;letter-spacing:0.5px}

  .card-meta{padding:10px 1.25rem;border-top:1px solid var(--border);display:flex;gap:16px;align-items:center;flex-wrap:wrap}
  .meta-item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text2);font-family:var(--mono);transition:color 0.15s}
  .meta-item:hover{color:var(--accent)}
  .meta-item a{color:var(--accent);text-decoration:none;transition:opacity 0.15s}
  .meta-item a:hover{opacity:0.75;text-decoration:underline}

  /* Battle verdict */
  .verdict{padding:10px 1.25rem;border-top:1px solid var(--border);display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700}
  .verdict.win{background:rgba(47,129,247,0.08);color:#2f81f7}
  .verdict.lose{background:rgba(248,81,73,0.08);color:#f85149}
  [data-theme="dark"] .verdict.win{background:rgba(47,129,247,0.12);color:#58a6ff}
  [data-theme="dark"] .verdict.lose{background:rgba(248,81,73,0.12);color:#f85149}

  /* Repos */
  .repos-section{padding:1rem 1.25rem;border-top:1px solid var(--border)}
  .repos-title{font-size:11px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px;display:flex;align-items:center;gap:6px}
  .repo-item{display:flex;align-items:center;gap:10px;padding:8px 6px;border-bottom:1px solid var(--border);border-radius:6px;transition:background 0.15s;margin:0 -6px}
  .repo-item:last-child{border-bottom:none}
  .repo-item:hover{background:var(--accent-light)}
  .repo-name{flex:1;min-width:0}
  .repo-name a{font-size:12px;font-family:var(--mono);color:var(--accent);text-decoration:none;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;transition:opacity 0.15s}
  .repo-name a:hover{opacity:0.75;text-decoration:underline}
  .repo-desc{font-size:11px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .repo-stars{display:flex;align-items:center;gap:3px;font-size:11px;color:var(--text2);font-family:var(--mono);flex-shrink:0}
  .repo-lang{font-size:10px;padding:2px 8px;border-radius:4px;background:var(--accent-light);color:var(--accent);border:1px solid var(--border);flex-shrink:0;font-family:var(--mono)}
  .repo-date{font-size:10px;color:var(--text3);font-family:var(--mono);flex-shrink:0}

  /* States */
  .state-box{background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:3rem 2rem;text-align:center;box-shadow:var(--shadow)}
  .spinner{width:28px;height:28px;border:2.5px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 0.7s linear infinite;margin:0 auto 1rem}
  @keyframes spin{to{transform:rotate(360deg)}}
  .loading-txt{font-size:13px;color:var(--text2);font-family:var(--mono)}
  .error-code{font-size:28px;font-weight:800;color:var(--text);font-family:var(--mono)}
  .error-msg{font-size:13px;color:var(--text2);margin-top:6px}
  .empty-txt{font-size:14px;font-weight:600;color:var(--text2)}
  .empty-sub{font-size:12px;color:var(--text3);margin-top:4px;font-family:var(--mono)}

  /* Card fade-in animation */
  @keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
  .profile-card{animation:fadeUp 0.35s ease both}
</style>
</head>
<body>
<div class="app">

  <div class="header">
    <div class="logo"><i class="ti ti-search"></i></div>
    <div class="brand">
      <h1>Dev-Detective</h1>
      <p>// github profile intelligence</p>
    </div>
    <button class="dark-toggle" id="theme-toggle" onclick="toggleTheme()" title="Toggle theme">
      <i class="ti ti-moon" id="theme-icon"></i>
    </button>
  </div>

  <div class="mode-bar">
    <button class="mode-btn active" id="btn-single" onclick="setMode('single')">Single Search</button>
    <button class="mode-btn" id="btn-battle" onclick="setMode('battle')">⚔ Battle Mode</button>
    <span class="mode-badge" id="mode-badge">Phase 1–2</span>
  </div>

  <div class="search-section">
    <div class="input-row" id="search-row">
      <i class="ti ti-brand-github" style="font-size:20px;color:var(--text2);flex-shrink:0"></i>
      <input class="gh-input" id="input1" placeholder="github username" onkeydown="onKey(event)" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"/>
      <span class="vs-label" id="vs-label" style="display:none">VS</span>
      <input class="gh-input" id="input2" placeholder="second username" onkeydown="onKey(event)" style="display:none" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"/>
      <button class="search-btn" id="search-btn" onclick="runSearch()">Investigate</button>
    </div>
  </div>

  <div class="output" id="output">
    <div class="state-box">
      <div style="font-size:32px;margin-bottom:12px"><i class="ti ti-fingerprint"></i></div>
      <p class="empty-txt">Enter a GitHub username to begin</p>
      <p class="empty-sub">Fetching profile, repos &amp; stats in real-time</p>
    </div>
  </div>

</div>

<script>
  // Theme toggle — light (white+blue) / dark (GitHub dark)
  let dark = false;
  function toggleTheme() {
    dark = !dark;
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : '');
    document.getElementById('theme-icon').className = dark ? 'ti ti-sun' : 'ti ti-moon';
  }

  let mode = 'single';

  function setMode(m) {
    mode = m;
    document.getElementById('btn-single').classList.toggle('active', m === 'single');
    document.getElementById('btn-battle').classList.toggle('active', m === 'battle');
    document.getElementById('input2').style.display = m === 'battle' ? 'flex' : 'none';
    document.getElementById('vs-label').style.display = m === 'battle' ? 'flex' : 'none';
    document.getElementById('mode-badge').textContent = m === 'battle' ? 'Phase 3 — Promise.all()' : 'Phase 1–2';
    document.getElementById('output').innerHTML = '';
  }

  function onKey(e) {
    if (e.key === 'Enter') runSearch();
  }

  // Utility: format ISO date to "25 Jan 2023"
  function fmtDate(iso) {
    if (!iso) return '—';
    const d = new Date(iso);
    return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
  }

  // Utility: format large numbers to "1.2k"
  function fmtNum(n) {
    if (n === null || n === undefined) return '0';
    if (n >= 1000) return (n / 1000).toFixed(1) + 'k';
    return n.toString();
  }

  // Fetch user profile from GitHub API
  async function fetchUser(username) {
    const response = await fetch(`https://api.github.com/users/${username}`);
    if (!response.ok) throw { status: response.status, user: username };
    return response.json();
  }

  // Fetch user's repositories
  async function fetchRepos(reposUrl) {
    const response = await fetch(reposUrl + '?sort=updated&per_page=10');
    if (!response.ok) return [];
    return response.json();
  }

  // Show loading state
  function showLoading(users) {
    const out = document.getElementById('output');
    if (mode === 'battle') {
      out.innerHTML = `<div class="battle-grid">
        ${users.map(u => `<div class="state-box"><div class="spinner"></div><p class="loading-txt">fetching ${u}...</p></div>`).join('')}
      </div>`;
    } else {
      out.innerHTML = `<div class="state-box"><div class="spinner"></div><p class="loading-txt">investigating ${users[0]}...</p></div>`;
    }
  }

  // Show error state (404 or other)
  function showError(status, user) {
    return `<div class="state-box">
      <div style="font-size:32px;margin-bottom:12px"><i class="ti ti-ghost"></i></div>
      <p class="error-code">${status}</p>
      <p class="error-msg">${status === 404 ? `"${user}" not found on GitHub` : 'API error — check rate limit or try again'}</p>
    </div>`;
  }

  // Calculate total stars across all repos
  function calcStars(repos) {
    return repos.reduce((acc, repo) => acc + (repo.stargazers_count || 0), 0);
  }

  // Build repos list HTML
  function repoListHTML(repos) {
    const top5 = repos.slice(0, 5);
    if (!top5.length) return '<p style="font-size:12px;color:var(--text3);font-family:var(--mono)">No public repositories yet.</p>';
    return top5.map(r => `
      <div class="repo-item">
        <div class="repo-name">
          <a href="${r.html_url}" target="_blank" rel="noopener">${r.name}</a>
          <span class="repo-desc">${r.description || ''}</span>
        </div>
        ${r.language ? `<span class="repo-lang">${r.language}</span>` : ''}
        <span class="repo-stars"><i class="ti ti-star" style="font-size:13px"></i>${fmtNum(r.stargazers_count)}</span>
        <span class="repo-date">${fmtDate(r.updated_at)}</span>
      </div>`).join('');
  }

  // Build full profile card HTML
  function buildCard(user, repos, verdict) {
    const stars = calcStars(repos);
    const verdictHTML = verdict === 'winner'
      ? `<div class="verdict win"><i class="ti ti-trophy"></i> Winner — ${fmtNum(stars)} ⭐ total stars</div>`
      : verdict === 'loser'
      ? `<div class="verdict lose"><i class="ti ti-x"></i> Loser — ${fmtNum(stars)} ⭐ total stars</div>`
      : '';

    return `<div class="profile-card ${verdict || ''}">
      <div class="card-header">
        <img class="avatar" src="${user.avatar_url}" alt="${user.login} avatar"/>
        <div class="user-info">
          <div class="user-name">${user.name || user.login}</div>
          <div class="user-login">@${user.login}</div>
          ${user.bio ? `<div class="user-bio">${user.bio}</div>` : ''}
        </div>
      </div>
      <div class="card-stats">
        <div class="stat"><div class="stat-val">${fmtNum(user.public_repos)}</div><div class="stat-lbl">Repos</div></div>
        <div class="stat"><div class="stat-val">${fmtNum(user.followers)}</div><div class="stat-lbl">Followers</div></div>
        <div class="stat"><div class="stat-val">${fmtNum(stars)}</div><div class="stat-lbl">Total ⭐</div></div>
      </div>
      <div class="card-meta">
        <span class="meta-item"><i class="ti ti-calendar" style="font-size:13px"></i>Joined ${fmtDate(user.created_at)}</span>
        ${user.location ? `<span class="meta-item"><i class="ti ti-map-pin" style="font-size:13px"></i>${user.location}</span>` : ''}
        ${user.blog ? `<span class="meta-item"><i class="ti ti-link" style="font-size:13px"></i><a href="${user.blog.startsWith('http') ? user.blog : 'https://' + user.blog}" target="_blank" rel="noopener">portfolio</a></span>` : ''}
        ${user.twitter_username ? `<span class="meta-item"><i class="ti ti-brand-twitter" style="font-size:13px"></i>@${user.twitter_username}</span>` : ''}
      </div>
      ${verdictHTML}
      <div class="repos-section">
        <div class="repos-title"><i class="ti ti-git-branch" style="font-size:14px"></i>Top 5 repos <span style="font-weight:400;color:var(--text3);font-size:10px;font-family:var(--mono)">by last updated</span></div>
        ${repoListHTML(repos)}
      </div>
    </div>`;
  }

  // Main search function
  async function runSearch() {
    const u1 = document.getElementById('input1').value.trim();
    const u2 = document.getElementById('input2').value.trim();

    if (!u1) return document.getElementById('input1').focus();
    if (mode === 'battle' && !u2) return document.getElementById('input2').focus();

    const btn = document.getElementById('search-btn');
    btn.disabled = true;
    btn.textContent = '...';

    const out = document.getElementById('output');
    showLoading(mode === 'battle' ? [u1, u2] : [u1]);

    try {
      if (mode === 'battle') {
        // Phase 3: Promise.all() — fetch both users simultaneously
        let results;
        try {
          results = await Promise.all([
            fetchUser(u1).then(async u => ({ user: u, repos: await fetchRepos(u.repos_url) })),
            fetchUser(u2).then(async u => ({ user: u, repos: await fetchRepos(u.repos_url) })),
          ]);
        } catch (e) {
          out.innerHTML = `<div class="battle-grid">${showError(e.status || 500, e.user || 'unknown')}<div class="state-box"><p class="empty-txt">Battle cancelled</p></div></div>`;
          return;
        }

        // Compare total stars and assign winner/loser
        const stars1 = calcStars(results[0].repos);
        const stars2 = calcStars(results[1].repos);
        const verdict1 = stars1 >= stars2 ? 'winner' : 'loser';
        const verdict2 = stars2 >= stars1 ? 'winner' : 'loser';

        out.innerHTML = `<div class="battle-grid">
          ${buildCard(results[0].user, results[0].repos, verdict1)}
          ${buildCard(results[1].user, results[1].repos, verdict2)}
        </div>`;

      } else {
        // Phase 1 & 2: Single search with endpoint chaining
        let userData, reposData;
        try {
          userData = await fetchUser(u1);           // Phase 1: fetch profile
          reposData = await fetchRepos(userData.repos_url); // Phase 2: chain to repos
        } catch (e) {
          out.innerHTML = showError(e.status || 500, e.user || u1);
          return;
        }
        out.innerHTML = buildCard(userData, reposData, '');
      }

    } finally {
      btn.disabled = false;
      btn.textContent = 'Investigate';
    }
  }
</script>
</body>
</html>
