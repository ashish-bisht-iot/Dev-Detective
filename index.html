<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dev-Detective | GitHub Profile Search</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="styles.css"/>
</head>
<body>
<div class="app">

  <div class="header">
    <div class="logo"><i class="ti ti-search"></i></div>
    <div class="brand">
      <h1>Dev-Detective</h1>
      <p>// github profile intelligence</p>
    </div>
    <button class="dark-toggle" id="theme-toggle" onclick="toggleTheme()" title="Toggle theme">
      <i class="ti ti-moon" id="theme-icon"></i>
    </button>
  </div>

  <div class="mode-bar">
    <button class="mode-btn active" id="btn-single" onclick="setMode('single')">Single Search</button>
    <button class="mode-btn" id="btn-battle" onclick="setMode('battle')">⚔ Battle Mode</button>
    <span class="mode-badge" id="mode-badge">Phase 1–2</span>
  </div>

  <div class="search-section">
    <div class="input-row" id="search-row">
      <i class="ti ti-brand-github" style="font-size:20px;color:var(--text2);flex-shrink:0"></i>
      <input class="gh-input" id="input1" placeholder="github username" onkeydown="onKey(event)" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"/>
      <span class="vs-label" id="vs-label" style="display:none">VS</span>
      <input class="gh-input" id="input2" placeholder="second username" onkeydown="onKey(event)" style="display:none" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"/>
      <button class="search-btn" id="search-btn" onclick="runSearch()">Investigate</button>
    </div>
  </div>

  <div class="output" id="output">
    <div class="state-box">
      <div style="font-size:32px;margin-bottom:12px"><i class="ti ti-fingerprint"></i></div>
      <p class="empty-txt">Enter a GitHub username to begin</p>
      <p class="empty-sub">Fetching profile, repos &amp; stats in real-time</p>
    </div>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
